name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets
        working-directory: mi-casa
        run: |
          mkdir -p www
          cp -r *.html *.css *.js *.json *.png *.jpg www/ 2>/dev/null || true

      - name: Install dependencies
        working-directory: mi-casa
        run: npm install

      - name: Initialize Capacitor Android
        working-directory: mi-casa
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply custom transparent icons
        working-directory: mi-casa
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp logo-512.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp logo-512.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp logo-512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done

      - name: Build APK (Debug)
        working-directory: mi-casa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK with clean name
        run: |
          cp mi-casa/android/app/build/outputs/apk/debug/app-debug.apk SuperList.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperList-APK
          path: SuperList.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "SuperList App"
          body: "Descarga directa del APK nativo e independiente de SuperList."
          files: SuperList.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
