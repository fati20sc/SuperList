name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # app.js se genera concatenando los modulos de js/. Si alguien edito
      # los modulos y no corro npm run build, esto avisa en vez de publicar
      # un bundle desactualizado.
      - name: Verificar que app.js esta sincronizado con js/
        run: node tools/verify-build.js

      - name: Correr los tests
        run: |
          npm install --no-save --no-fund --no-audit vitest jsdom
          npx vitest run
          node tests/test_render_settings.js
          node tests/test_invite_code.js
          node tests/test_click_handler.js

      # La app principal vive en la raiz del repo.
      # Se arma www/ con los archivos estaticos de ahi.
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html app.js styles.css sw.js manifest.json *.webp *.png *.jpg www/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          npm install --no-save @capacitor/core@^6.1.2 @capacitor/android@^6.1.2 @capacitor/cli@^6.1.2

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply custom transparent icons
        run: |
          # Remove anydpi-v26 XMLs so Android uses pure transparent PNG icons without white borders
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          ICON_SRC=app-icon.png
          if [ ! -f "$ICON_SRC" ]; then ICON_SRC=logo-512.png; fi
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp "$ICON_SRC" "$dir/ic_launcher.png"
              cp "$ICON_SRC" "$dir/ic_launcher_round.png"
              cp "$ICON_SRC" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done

      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK with clean name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SuperList.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperList-APK
          path: SuperList.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SuperList App"
          body: "Descarga directa del APK nativo e independiente de SuperList."
          files: SuperList.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
