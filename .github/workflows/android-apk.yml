name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # app.js se genera concatenando los modulos de js/. Si alguien edito
      # los modulos y no corro npm run build, esto avisa en vez de publicar
      # un bundle desactualizado.
      - name: Verificar que app.js esta sincronizado con js/
        run: node tools/verify-build.js

      - name: Correr los tests
        run: |
          npm install --no-save --no-fund --no-audit vitest jsdom
          npx vitest run

      # Solo viajan al APK los .webp (livianos). Los .png quedan en la raiz del
      # repo porque el paso de iconos de Android los necesita, pero no se
      # empaquetan en www/ porque la app no los referencia.
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html app.js styles.css sw.js manifest.json *.webp pensando.jpg www/ 2>/dev/null || true
          echo "--- contenido de www/ ---"
          ls -la www/

      # OJO: estas versiones tienen que existir. Si una no existe, npm install
      # falla entero y el build se cae en los tests, que es el primer paso que
      # usa package.json. Se fijaron contra las ultimas 6.x publicadas.
      - name: Install dependencies
        run: |
          npm install --no-save \
            @capacitor/core@^6.1.2 @capacitor/android@^6.1.2 @capacitor/cli@^6.1.2 \
            @capacitor/app@^6.0.2 @capacitor/local-notifications@^6.1.1 \
            @capacitor/push-notifications@^6.0.5

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # Las notificaciones push del APK necesitan la configuración de Firebase.
      # google-services.json identifica la app (NO es un secreto, igual que el
      # API key de Android: viaja dentro del APK de todas formas). Si el archivo
      # no está, el build sigue igual pero SIN notificaciones nativas: por eso el
      # script no falla, solo avisa.
      - name: Configure Firebase for push notifications
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json instalado: las notificaciones push van a funcionar."
          else
            echo "AVISO: no hay google-services.json en la raiz del repo."
            echo "El APK se va a generar igual, pero las notificaciones push no van a funcionar."
            echo "Para activarlas: creá el proyecto en Firebase y subí el archivo a la raiz."
          fi

      # FCM identifica al usuario por el certificado que firma el APK. Si cada
      # build usara una clave distinta, Google rechazaría el token. Por eso el
      # script aplica SIEMPRE la misma clave (android-keys/upload.keystore).
      - name: Apply fixed signing key and Firebase Gradle plugin
        run: node tools/android-push-setup.js

      - name: Generate upload certificate SHA-1 for Firebase
        if: hashFiles('android-keys/upload.keystore') != ''
        run: |
          echo "SHA-1 de la clave de firma (registralo en Firebase):"
          keytool -list -v -keystore android-keys/upload.keystore -storepass superlist \
            | grep -E 'SHA1:' | sed 's/^[[:space:]]*/  /'

      - name: Apply custom transparent icons
        run: |
          # Remove anydpi-v26 XMLs so Android uses pure transparent PNG icons without white borders
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          ICON_SRC=app-icon.png
          if [ ! -f "$ICON_SRC" ]; then ICON_SRC=logo-512.png; fi
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp "$ICON_SRC" "$dir/ic_launcher.png"
              cp "$ICON_SRC" "$dir/ic_launcher_round.png"
              cp "$ICON_SRC" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done

      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK with clean name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SuperList.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperList-APK
          path: SuperList.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SuperList App"
          body: "Descarga directa del APK nativo e independiente de SuperList."
          files: SuperList.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
